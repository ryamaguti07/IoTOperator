worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    server_tokens off;

    upstream flask_operator {
        server 127.0.0.1:5000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        location / {
            proxy_pass http://flask_operator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Porta exclusiva para envio de SLA. O restante da API fica no servidor :80.
    server {
        listen 8090;
        server_name _;
        client_max_body_size 1m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location = /health {
            proxy_pass http://flask_operator/health;
        }

        location /sla {
            proxy_pass http://flask_operator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"esta porta aceita apenas /sla e /health"}';
        }
    }
}
